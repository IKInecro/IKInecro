<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34"><defs>
<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#f0f6fc" stop-opacity=".055"/>
 <stop offset="1" stop-color="#f0f6fc" stop-opacity=".015"/>
</linearGradient>
<linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#f0f6fc" stop-opacity=".18"/>
 <stop offset="1" stop-color="#f0f6fc" stop-opacity=".03"/>
</linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
 <stop offset=".5" stop-color="#ffffff" stop-opacity=".07"/>
 <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
 <stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#3fb950"/>
</linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
 <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/>
</filter>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
 <feGaussianBlur stdDeviation="8"/>
</filter><style>.sweep{animation:sweep 9s cubic-bezier(.45,.05,.35,1) infinite}
@keyframes sweep{0%{transform:translateX(-280px)}60%,100%{transform:translateX(1040px)}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.l{opacity:0;animation:fadein .45s ease forwards}
@keyframes fadein{to{opacity:1}}
.d1{animation-delay:.15s}.d2{animation-delay:.55s}.d3{animation-delay:.95s}.d4{animation-delay:1.35s}.d5{animation-delay:1.75s}
@media(prefers-reduced-motion:reduce){.sweep,.pulse,.blink{animation:none}.l{opacity:1;animation:none}}</style></defs><rect width="132" height="34" rx="17" fill="url(#tg)" stroke="url(#eg)" filter="url(#sh)"/>
<text x="66" y="22" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="3" font-weight="bold"><tspan fill="#3fb950">// </tspan><tspan fill="#8b949e">ARCADE</tspan></text></svg>